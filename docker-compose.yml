services:

  web:
    build:
      context: ./web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./web:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--protocol=tcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai_service:
    build:
      context: ./ai_service
    ports:
      - "8001:8000"
    volumes:
      - ./ai_service/app/models:/app/app/models
      - ./data:/data:ro
    environment:
      FAQ_DATA_PATH: /data/faq_dataset.csv

volumes:
  mysql_data:
  media_data: