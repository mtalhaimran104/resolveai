{% extends "auth-base.html" %}
{% load static %}

{% block content %}

<main class="login-box">
  <!--begin::Brand-->
  <h1 class="login-logo">
    <a href="{% url 'dashboard' %}" class="d-inline-flex align-items-center">
      <span class="ra-logo-icon"><i class="bi bi-headset"></i></span>
      <span class="ra-logo">ResolveAI</span>
    </a>
  </h1>
  <p class="text-center ra-tagline mb-4">Intelligent Help Desk and Support Platform</p>
  <!--end::Brand-->

  <div class="card">
    <div class="card-body login-card-body text-center">
      <i class="bi bi-shield-check text-success mb-3" style="font-size: 2.5rem;"></i>
      <p class="login-box-msg mb-1">Password reset complete</p>
      <p class="text-secondary">Your password has been changed. You can now log in with your new password.</p>

      <div class="d-grid gap-2 mt-3">
        <a href="{% url 'login' %}" class="btn btn-primary">Go to login</a>
      </div>
    </div>
  </div>
</main>

{% endblock %}
